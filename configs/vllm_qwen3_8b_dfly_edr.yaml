# Second-stage exact Expected Decoding Rounds training for the released Qwen3-8B DFly draft.
# Single-GPU layout (paper: one NVIDIA H200): the HF target and the draft share
# the GPU. run.sh keeps these H200 execution sizes and adjusts only
# grouping/temporary sizes for B200 or RTX PRO 6000.
model:
  # Local snapshot of Qwen/Qwen3-8B (e.g. `hf download Qwen/Qwen3-8B --local-dir ./target_models/Qwen3-8B`).
  target_model_path: ./target_models/Qwen3-8B
  target_model_backend: hf
  trust_remote_code: true
  # The draft is built from this local architecture config; only tensor weights
  # are loaded from the released checkpoint.
  draft_model_config: angelspec/config/dfly_qwen3_8b_draft_config.json
  lm_head_key: lm_head.weight

dataset:
  # One target-regenerated cache per epoch (tools/regenerate_perfectblend.py
  # --training-config <this file> --epoch 1 writes ${cache_dir}/epoch1).
  epoch_cache_dirs: ["${cache_dir}/epoch1"]
  # Relative to this config file, i.e. <repo>/dataset/Open-PerfectBlend/.
  train_data_path: ../dataset/Open-PerfectBlend/open-perfectblend.jsonl
  eval_data_path: null
  chat_template: qwen
  prompt_key: conversations
  min_loss_tokens: 32
  shuffle_dataset: true
  # Regenerated rows may use every input slot (prompt + response <= max_seq_length).
  allow_full_length_cached_sequences: true
  # Target rollout policy (paper Sec. 5.1: T=1, no top-p/top-k, non-thinking).
  # Selects the matching regenerated cache; EDR and distribution-aware E2E use
  # it as the target distribution.
  target_sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    enable_thinking: false

training:
  # Fallback initialization only. run.sh resumes full state from the output
  # directory's tracker when present.
  load_path: ./draft_checkpoints/Qwen3-8B-DFly-Block8
  continual_training: true

  attention_backend: flex_attention
  micro_batch_size: 1
  # Global batch = 1 microbatch * 1 GPU * 96 accumulation steps = 96, executed
  # as 48 two-row EDR calls (dflash_edr_cross_row_batch_size: 2).
  draft_accumulation_steps: 96
  # Sort the 96 rows of each optimizer step so similar lengths share a call.
  length_balance_optimizer_step: true
  learning_rate: 3e-5
  min_lr: 3e-6
  lr_decay_style: constant  # Linear warmup, then no decay (paper Table 3).
  weight_decay: 0.01
  max_concurrent_batches: 1
  max_grad_norm: 1.0
  max_seq_length: 4096
  num_epochs: 1
  num_train_steps: null
  seed: 42
  ttt_length: 7

  # Single-GPU training requires unsharded (REPLICATE) parameters.
  fsdp_strategy: REPLICATE
  fsdp_reduce_dtype: bfloat16
  prefetch_depth: 0  # Single GPU: target features are computed in-process.
  warmup_ratio: 0.04  # 4% linear warmup (paper Table 3).
  save_interval: 1000
  save_per_epoch: true
  max_checkpoints: 60
  distributed_timeout_minutes: 30

  training_num_nodes: 1
  training_num_gpus_per_node: 1

  # block_size counts learned proposals: q[n,n+1]..q[n,n+7] (paper B=7). The
  # released Block8 checkpoint runs eight query slots; slot 0 is the
  # already-committed input anchor and never enters EDR's DP.
  dflash_block_size: 7
  dflash_query_includes_input_anchor: true
  dflash_num_target_layers: 5
  dflash_loss_objective: edr
  # Must match the target-response cache generated by regenerate_perfectblend.py.
  # Draft uses the same T, with no draft top-k/top-p filtering.
  dflash_edr_temperature: ${dataset.target_sampling.temperature}
  dflash_edr_top_k: ${dataset.target_sampling.top_k}
  dflash_edr_top_p: ${dataset.target_sampling.top_p}
  # Sample at most 512 distinct round starts per horizon. Short horizons use a
  # bounded 64/128/256/512 query bucket instead of running all padded slots.
  dflash_num_anchors: 512
  # Total anchor blocks per detached-statistics call, shared by all horizons and
  # rows of a group. Two single-response rows x 512 sampled anchors keep each
  # gradient call at most 1024 blocks.
  dflash_edr_chunk_size: 2048
  # Combine two consecutive accumulation rows into one EDR call; they share the
  # dflash_edr_chunk_size block budget. The optimizer batch stays 96 rows.
  dflash_edr_cross_row_batch_size: 2
  # CPU workers for the exact DP; capped by the number of horizons in a group.
  dflash_edr_dp_workers: 8
  # Stream exact conditional-rejection/acceptance statistics over vocabulary
  # tiles instead of retaining full FP32 probabilities for Qwen3's vocabulary.
  dflash_edr_vocab_chunk_size: 65536
  # Share the draft context K/V between the statistics sweep and gradient pass.
  # Boolean rejection masks need ~1 GiB for 2 x 512 x 7 x 151936 entries; the
  # budget bounds their total per model call at 2 GiB.
  dflash_edr_reuse_context_cache: true
  dflash_edr_rejection_cache_max_mb: 2048
  # Coalesce only equal-width teacher groups; no additional padding work.
  single_gpu_target_batch_size: 6
  single_gpu_target_max_tokens: 16384
  # One source conversation per row: avoids packed-context work in EDR and keeps
  # each epoch equal to one pass over the source rows.
  dflash_packing: false
  dflash_packing_token_weighted_loss: false

inference:
  # Single-GPU HF target features are pre-final-norm last hidden states, the
  # same contract as the vLLM feature cache. No inference engine is started.
  store_last_hidden_states: true
  last_hidden_states_prenorm: true

output_dir: ./outputs/qwen3-8b-dfly-cpt-edr
cache_dir: ./dataset/Open-PerfectBlend/cache/qwen3-8b
model_download_dir: null

logging:
  report_to: none

debug:
  save_debug_train_data: null
  debug_train_only: false
  debug_inference_only: false
